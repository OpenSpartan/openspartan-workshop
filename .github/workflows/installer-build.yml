name: Build installer

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'
  workflow_dispatch:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'

permissions:
  contents: write
  packages: write
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_URL: "https://nuget.pkg.github.com/dend/index.json"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64, x86]
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        source-url: ${{ env.NUGET_URL }}
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
    - name: Verify commit exists in origin/master
      run: |
        git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/master
    - name: Build app (${{ matrix.arch }})
      working-directory: ./src/OpenSpartan.Workshop
      run: dotnet build --configuration Release -p:Platform=${{ matrix.arch }}
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2
    - name: Install WiX
      run: dotnet tool install --global wix
    - name: Restore bundle dependencies (${{ matrix.arch }})
      working-directory: ./src/OpenSpartan.Workshop.Installer.Bundle
      shell: powershell
      run: ./Restore-Dependencies.ps1 -Arch ${{ matrix.arch }}
    - name: Build installer bundle (${{ matrix.arch }})
      working-directory: ./src/OpenSpartan.Workshop.Installer.Bundle
      run: msbuild -restore -p:Configuration=Release -p:Platform=${{ matrix.arch }}
    - name: Upload bundle artifact
      uses: actions/upload-artifact@v4
      with:
        name: bundle-${{ matrix.arch }}
        path: ./src/OpenSpartan.Workshop.Installer.Bundle/bin/${{ matrix.arch }}/Release/OpenSpartan.Workshop.Installer.Bundle-${{ matrix.arch }}.exe
        if-no-files-found: error
        retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Download all bundle artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: bundle-*
        merge-multiple: true
    - name: List artifacts
      run: ls -la artifacts
    - name: Publish GitHub release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/OpenSpartan.Workshop.Installer.Bundle-*.exe
        body_path: ./CURRENTRELEASE.md
