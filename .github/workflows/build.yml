name: Build

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'
  workflow_dispatch:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '**/*.gitignore'
      - '**/*.gitattributes'

permissions:
  contents: read
  packages: write
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  NUGET_URL: "https://nuget.pkg.github.com/dend/index.json"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, ARM64, x86]
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        source-url: ${{ env.NUGET_URL }}
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
    - run: Invoke-webrequest -uri https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe -OutFile windowsappruntimeinstall.exe
      shell: powershell
    - run: '&.\windowsappruntimeinstall.exe'
      shell: powershell
    - name: Verify commit exists in origin/master
      run: |
        git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/master
    - name: Build (${{ matrix.arch }})
      working-directory: ./src/OpenSpartan.Workshop
      run: dotnet build --configuration Release -p:Platform=${{ matrix.arch }}
